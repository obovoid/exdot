<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Exdot language documentation">
  <title>Exdot documentation</title>
  <style>/* Exdot Documentation — all colors are semantic theme variables. */
* { box-sizing:border-box; }
html, body, #root { margin:0; min-width:320px; min-height:100%; }
body { font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
button,select,input,textarea { font:inherit; }
button { cursor:pointer; }
button:disabled { cursor:not-allowed; opacity:.35; }
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid var(--color-accent); outline-offset:2px; }
.app-shell {
  background:var(--color-app-background); color:var(--color-text-primary);
  min-height:100vh; height:100vh; overflow:hidden; font-size:15px;
}
.app-shell:has(.drawer) { isolation:isolate; }
.app-shell:has(.settings-drawer) { /* theme drawer always inherits active tokens */ }
.icon { flex:0 0 auto; vertical-align:middle; }
.topbar {
  height:62px; width:100%; display:flex; align-items:center;
  background:var(--color-header-background); border-bottom:1px solid var(--color-border);
  position:relative; z-index:10; padding-right:23px;
}
.brand { width:300px; flex:0 0 300px; padding-left:25px; color:var(--color-accent);
  font-size:24px; letter-spacing:-.5px; line-height:1; font-weight:750; white-space:nowrap; }
.brand-second { font-weight:700; }
.mobile-menu { display:none; }
.search-wrapper { height:40px; width:min(352px,32vw); margin-left:44px; position:relative; display:flex; align-items:center;
  border:1px solid var(--color-border); border-radius:9px; background:var(--color-input-background);
  color:var(--color-text-muted); gap:8px; padding:0 12px; }
.search-wrapper:focus-within { border-color:var(--color-accent); }
.search-wrapper input { flex:1; min-width:0; border:0; outline:0; color:var(--color-text-primary); background:transparent; font-size:14px; }
.search-wrapper input:focus-visible { outline:none; }
.search-wrapper input::placeholder { color:var(--color-text-secondary); }
.search-wrapper input::-webkit-search-cancel-button { cursor:pointer; }
.search-wrapper kbd { border-radius:5px; font-family:inherit; background:var(--color-surface-raised); color:var(--color-text-secondary); font-size:11px; padding:4px 6px; white-space:nowrap; line-height:1; }
.topbar-actions { margin-left:auto; display:flex; align-items:center; gap:9px; }
.button { appearance:none; border:1px solid transparent; background:transparent; color:var(--color-text-primary);
  height:36px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 13px;
  border-radius:8px; font-size:13px; font-weight:650; white-space:nowrap; transition:background .15s,border-color .15s,transform .15s; }
.button:hover:not(:disabled) { transform:translateY(-1px); }
.button.primary { background:var(--color-accent); color:var(--color-on-accent); border-color:var(--color-accent); }
.button.primary:hover:not(:disabled) { background:var(--color-accent-hover); border-color:var(--color-accent-hover); }
.button.outline { border-color:var(--color-border); background:var(--color-surface-background); color:var(--color-text-secondary); }
.button.outline:hover:not(:disabled) { background:var(--color-surface-hover); color:var(--color-text-primary); }
.button.small { font-size:12px; height:33px; }
.button .icon { flex-shrink:0; }
.top-action { height:36px; }
.app-main { height:calc(100vh - 62px); min-height:0; display:flex; }
.sidebar { width:300px; flex:0 0 300px; background:var(--color-sidebar-background);
  display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--color-border); }
.sidebar-scroll { padding:19px 23px 16px 25px; flex:1 1 auto; min-height:0; overflow-y:auto; }
.sidebar-kicker { color:var(--color-text-muted); font-size:10px; font-weight:750; letter-spacing:1.1px; margin-bottom:17px; display:none; }
.nav-group { margin-bottom:10px; }
.group-toggle { width:100%; padding:0; height:27px; display:flex; align-items:center; justify-content:space-between;
  background:none; border:0; color:var(--color-text-primary); font-size:15px; font-weight:700; text-align:left; }
.group-toggle .icon { color:var(--color-text-secondary); }
.group-items { margin:2px 0 0; border-left:1px solid var(--color-border); padding:0 6px 0 8px; }
.nav-entry { display:block; width:100%; padding:6px 9px; margin-bottom:2px; min-height:29px; text-align:left;
  color:var(--color-text-secondary); background:transparent; border:0; border-radius:4px; font-size:14px; font-weight:550;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.nav-entry:hover { background:var(--color-surface-hover); color:var(--color-text-primary); }
.nav-entry.selected { background:var(--color-selection-background); color:var(--color-selection-text); font-weight:700; }
.nav-empty { font-size:12px; color:var(--color-text-muted); padding:8px 9px; }
.no-search { color:var(--color-text-muted); font-size:12px; line-height:1.6; padding:12px 3px; }
.sidebar-footer { border-top:1px solid var(--color-border); padding:19px 24px 21px; }
.side-footer-label,.field-label { display:block; color:var(--color-text-muted); font-size:10px; font-weight:800; letter-spacing:1.15px; margin-bottom:13px; }
.side-stat { display:flex; align-items:center; gap:9px; color:var(--color-text-secondary); font-size:12px; margin:11px 0; }
.side-stat svg { color:var(--color-text-muted); }
.sidebar-settings { margin-top:10px; border:1px solid var(--color-border); color:var(--color-text-secondary);
  background:var(--color-surface-background); border-radius:7px; width:100%; height:35px; display:flex; align-items:center;
  justify-content:center; gap:9px; font-size:12px; }
.sidebar-settings:hover { background:var(--color-surface-hover); color:var(--color-text-primary); }
.content { flex:1; overflow-y:auto; overflow-x:hidden; min-width:0; min-height:0;
  scrollbar-color:var(--color-border) transparent; scrollbar-width:thin; }
.doc-article { width:min(100%,1110px); padding:43px 45px 20px 44px; margin:0 auto; }
.article-title-row { display:flex; align-items:center; justify-content:space-between; gap:24px; min-height:89px; }
.article-heading-wrap { min-width:0; }
.eyebrow { color:var(--color-text-muted); font-size:10px; letter-spacing:1.5px; font-weight:700; text-transform:uppercase; margin-bottom:6px; display:none; }
h1,h2,h3,p { margin-top:0; }
h1 { font-size:56px; letter-spacing:-1.55px; line-height:1.13; margin-bottom:0; font-weight:770; overflow-wrap:anywhere; }
.edit-button { flex-shrink:0; }
.title-rule { height:1px; background:var(--color-border); margin:0 -45px 26px -44px; opacity:.62; }
.doc-intro { color:var(--color-text-secondary); font-size:16px; line-height:1.85; margin:0 0 43px; max-width:880px; }
.doc-section { margin-bottom:17px; }
.doc-section:has(h2) { margin-top:48px; }
.doc-intro + .doc-section:has(h2) { margin-top:0; }
.doc-section h2 { font-size:33px; letter-spacing:-.9px; font-weight:750; line-height:1.3; margin-bottom:17px; }
.doc-paragraph { margin:15px 0 0; font-size:16px; color:var(--color-text-secondary); line-height:1.77; }
.inline-code { font-size:.85em; background:var(--color-border); color:var(--color-text-secondary); border-radius:1px;
  padding:2px 5px; font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; }
.code-block { position:relative; background:var(--color-code-background); border:1px solid var(--color-code-border);
  border-radius:0; width:100%; }
.code-block pre { margin:0; padding:12px 14px; overflow:auto; font-size:13.5px; line-height:1.8;
  color:var(--color-code-default); font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  tab-size:4; white-space:pre; }
.code-block code { font:inherit; }
.code-block ::selection { background:var(--color-code-selection); }
.code-copy { background:var(--color-code-background); position:absolute; right:9px; top:8px; border:1px solid var(--color-code-border);
  color:var(--color-text-muted); display:flex; align-items:center; justify-content:center; border-radius:5px; width:27px; height:27px;
  opacity:0; transition:opacity .1s, color .1s; }
.code-block:hover .code-copy,.code-copy:focus-visible { opacity:1; }
.code-copy:hover { color:var(--color-text-primary); }
.tok-keyword { color:var(--color-code-keyword); }
.tok-variable { color:var(--color-code-binding-node); }
.tok-type { color:var(--color-code-type); }
.tok-number { color:var(--color-code-number); }
.tok-string { color:var(--color-code-string); }
.tok-comment { color:var(--color-code-comment); }
.tok-operator { color:var(--color-code-operator); }
.tok-function { color:var(--color-code-function); }
.tok-property { color:var(--color-code-binding-node); }
.tok-punctuation { color:var(--color-code-default); }
.documentation-stage { margin-top:46px; padding-top:25px; border-top:1px solid var(--color-border); }
.section-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:17px; }
.stage-heading { font-size:26px; line-height:1.2; font-weight:750; margin-bottom:7px; letter-spacing:-.55px; }
.stage-subtitle { font-size:13px; color:var(--color-text-muted); margin:0; }
.stage-completed { font-size:12px; color:var(--color-text-secondary); white-space:nowrap; padding-bottom:3px; }
.progress-bar { height:4px; background:var(--color-surface-raised); border-radius:10px; margin-bottom:15px; overflow:hidden; }
.progress-bar > div { height:100%; background:var(--color-status-done); transition:width .2s; border-radius:10px; }
.stage-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:9px; }
.stage-card { min-width:0; min-height:103px; padding:12px 12px 11px; background:var(--color-surface-background); border:1px solid var(--color-border); border-radius:8px; display:flex; flex-direction:column; }
.stage-index { color:var(--color-text-muted); font:600 11px "SFMono-Regular",Consolas,monospace; margin-bottom:9px; }
.stage-name { font-size:13px; font-weight:680; line-height:1.25; margin-bottom:auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stage-state { display:flex; align-items:center; gap:6px; margin-top:10px; color:var(--stage-tint); }
.stage-dot { width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
.stage-state select { appearance:none; border:0; background:none; color:inherit; font-size:11px; font-weight:650; flex:1; width:100%; min-width:0;
  outline:0; cursor:pointer; }
.stage-state select option { background:var(--color-surface-raised); color:var(--color-text-primary); }
.stage-state .icon { pointer-events:none; }
.stage-footnote { display:flex; align-items:center; gap:7px; color:var(--color-text-muted); margin-top:13px; font-size:11px; line-height:1.5; }
.end-space { height:65px; }
.empty-document { min-height:65vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  color:var(--color-text-secondary); padding:30px; }
.empty-document .icon { color:var(--color-accent); }
.empty-document h1 { font-size:30px; margin-top:14px; color:var(--color-text-primary); }
.empty-document p { margin:12px auto 24px; max-width:390px; line-height:1.6; }
.overlay-shell { position:fixed; inset:0; z-index:50; }
.modal-scrim { position:absolute; inset:0; background:var(--color-overlay-background); opacity:.75; }
.drawer { position:absolute; top:0; right:0; height:100%; width:min(100%,680px); border-left:1px solid var(--color-border);
  background:var(--color-sidebar-background); box-shadow:-14px 0 55px color-mix(in srgb,var(--color-shadow) 16%,transparent); display:flex; flex-direction:column; overflow:hidden; }
.settings-drawer { width:min(100%,620px); }
.drawer-top { height:102px; flex:0 0 auto; padding:23px 27px 15px 30px; display:flex; justify-content:space-between; align-items:center; }
.drawer-top h2 { font-size:25px; line-height:1.2; margin:5px 0 0; font-weight:750; letter-spacing:-.5px; }
.drawer-eyebrow { font-size:10px; letter-spacing:1.3px; font-weight:800; color:var(--color-text-muted); }
.icon-button { width:30px; height:30px; display:inline-flex; justify-content:center; align-items:center; border:0; border-radius:6px;
  color:var(--color-text-secondary); background:transparent; }
.icon-button:hover:not(:disabled) { background:var(--color-surface-hover); color:var(--color-text-primary); }
.icon-button.danger:hover:not(:disabled) { color:var(--color-danger); }
.close-drawer { width:35px; height:35px; }
.drawer-tabs { display:flex; gap:7px; flex:0 0 auto; padding:0 30px 14px; border-bottom:1px solid var(--color-border); }
.drawer-tab { display:flex; align-items:center; justify-content:center; gap:8px; border-radius:7px; padding:8px 13px;
  border:1px solid transparent; background:transparent; color:var(--color-text-secondary); font-size:13px; font-weight:620; }
.drawer-tab:hover { background:var(--color-surface-hover); }
.drawer-tab.active { background:var(--color-selection-background); color:var(--color-selection-text); }
.drawer-scroll { flex:1; min-height:0; overflow-y:auto; padding:23px 30px 32px; scrollbar-color:var(--color-border) transparent; scrollbar-width:thin; }
.drawer-bottom { min-height:66px; padding:13px 30px; flex:0 0 auto; border-top:1px solid var(--color-border); display:flex; align-items:center; justify-content:space-between; gap:12px; }
.drawer-bottom > span { color:var(--color-text-muted); font-size:11px; }
.palette-actions { margin-bottom:21px; }
.preset-buttons { display:flex; gap:8px; margin-top:4px; }
.color-tabs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
.color-tab { border:1px solid var(--color-border); background:var(--color-surface-background); border-radius:7px; text-align:left; padding:12px;
  display:flex; align-items:center; justify-content:space-between; gap:5px; color:var(--color-text-secondary); font-weight:650; font-size:12px; }
.color-tab:hover { background:var(--color-surface-hover); }
.color-tab.active { color:var(--color-accent); border-color:var(--color-accent); background:var(--color-surface-raised); }
.color-tab-count { font:550 10px "SFMono-Regular",Consolas,monospace; color:var(--color-text-muted); }
.color-group-header { margin:25px 0 14px; }
.color-group-header h3,.settings-data h3 { font-size:17px; font-weight:700; margin:0 0 5px; }
.color-group-header p,.settings-description,.settings-data p { font-size:13px; line-height:1.65; color:var(--color-text-secondary); margin:0; }
.color-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
.color-field { min-width:0; background:var(--color-surface-background); border:1px solid var(--color-border); border-radius:8px; padding:11px; }
.color-name { display:block; font-size:12px; color:var(--color-text-secondary); margin-bottom:9px; line-height:1.25; min-height:16px; }
.color-controls { display:flex; align-items:center; gap:8px; }
.color-controls input[type=color] { width:36px; height:32px; border:1px solid var(--color-border); border-radius:6px; background:none; cursor:pointer; padding:3px; flex:0 0 auto; }
.color-controls input[type=color]::-webkit-color-swatch-wrapper { padding:0; }
.color-controls input[type=color]::-webkit-color-swatch { border:0; border-radius:3px; }
.color-controls input[type=text] { flex:1; width:100%; min-width:0; height:32px; border-radius:6px; border:1px solid var(--color-border);
  color:var(--color-text-primary); background:var(--color-input-background); text-align:center; font-size:12px; font-family:"SFMono-Regular",Consolas,monospace; }
.color-preview { padding:17px; margin-top:25px; border-radius:9px; border:1px solid var(--color-border); background:var(--color-surface-background); }
.preview-heading { display:flex; justify-content:space-between; align-items:center; color:var(--color-text-muted); font-size:10px; letter-spacing:1px; font-weight:800; margin-bottom:12px; }
.preview-dot { height:7px; width:7px; background:var(--color-status-done); border-radius:50%; }
.color-preview .code-block { border-radius:5px; }
.color-preview .code-block pre { font-size:12px; }
.color-preview p { margin:12px 0 0; font-size:11px; line-height:1.6; color:var(--color-text-muted); }
.settings-description { margin:0 0 20px; }
.stage-editor-card { background:var(--color-surface-background); border:1px solid var(--color-border); border-radius:9px; padding:13px 15px 16px; margin-bottom:10px; }
.stage-editor-top,.section-editor-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
.stage-sequence { font:650 12px "SFMono-Regular",Consolas,monospace; color:var(--color-accent); }
.stage-editor-actions { display:flex; gap:2px; }
.form-field { display:flex; flex-direction:column; gap:7px; margin-bottom:13px; min-width:0; }
.form-field:last-child { margin-bottom:0; }
.form-field > span { color:var(--color-text-secondary); font-size:12px; font-weight:600; }
.form-field input,.form-field textarea,.form-field select { display:block; width:100%; min-width:0; border:1px solid var(--color-border); background:var(--color-input-background);
  color:var(--color-text-primary); border-radius:7px; padding:10px 11px; font-size:13px; line-height:1.5; }
.form-field input,.form-field select { height:39px; }
.form-field textarea { resize:vertical; min-height:70px; }
.form-field input::placeholder,.form-field textarea::placeholder { color:var(--color-text-muted); }
.add-full { width:100%; margin-top:4px; height:41px; color:var(--color-accent); background:var(--color-surface-background); border:1px dashed var(--color-border); }
.add-full:hover { background:var(--color-surface-hover); }
.settings-help,.editor-info { font-size:12px; color:var(--color-text-muted); line-height:1.65; display:flex; align-items:flex-start; gap:7px; margin-top:19px; }
.settings-help .icon,.editor-info .icon { margin-top:1px; }
.settings-data h3 { margin-top:2px; margin-bottom:10px; }
.data-buttons { display:flex; flex-wrap:wrap; gap:9px; margin-top:21px; }
.data-divider { margin:33px 0; border-top:1px solid var(--color-border); }
.settings-data p + .button { margin-top:22px; }
.error-text { color:var(--color-danger)!important; margin-top:16px!important; }
.editor-drawer .drawer-top { border-bottom:1px solid var(--color-border); }
.editor-scroll { padding-top:27px; }
.editor-form-grid { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); gap:12px; }
.editor-section-heading { margin:27px 0 16px; }
.editor-section-heading h3 { font-size:17px; margin:0 0 6px; }
.editor-section-heading p { font-size:12px; color:var(--color-text-muted); margin:0; }
.section-editor { background:var(--color-surface-background); border:1px solid var(--color-border); padding:14px; border-radius:8px; margin-bottom:11px; }
.section-editor-top { margin-bottom:14px; }
.section-editor-top > span { font-size:10px; font-weight:750; letter-spacing:1px; color:var(--color-text-muted); }
.code-textarea { font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace!important; font-size:12px!important; }
.add-section-buttons { display:flex; gap:9px; margin-top:16px; }
.add-section-buttons .button { flex:1; }
.delete-entry { border:0; background:transparent; color:var(--color-danger); display:flex; align-items:center; gap:7px;
  font-size:12px; padding:8px 0; margin-top:23px; }
.delete-entry:hover { text-decoration:underline; }
.bottom-actions { display:flex; align-items:center; gap:8px; }
.toast { position:fixed; z-index:100; bottom:22px; right:24px; display:flex; align-items:center; gap:8px;
  border:1px solid var(--color-border); padding:11px 14px; border-radius:9px;
  background:var(--color-surface-raised); color:var(--color-text-primary); box-shadow:0 8px 24px color-mix(in srgb,var(--color-shadow) 15%,transparent); font-size:12px; }
.toast .icon { color:var(--color-status-done); }
.mobile-shade { display:none; }
@media (max-width:1150px) {
  .topbar { padding-right:14px; }
  .brand,.sidebar { width:258px; flex-basis:258px; }
  .brand { font-size:21px; padding-left:20px; }
  .search-wrapper { margin-left:24px; }
  .doc-article { padding-left:36px; padding-right:36px; }
  .title-rule { margin-left:-36px; margin-right:-36px; }
  .stage-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
}
@media (max-width:820px) {
  .brand { width:auto; flex-basis:auto; padding-left:15px; font-size:19px; display:flex; gap:9px; align-items:center; }
  .mobile-menu { border:0; background:none; color:var(--color-accent); padding:4px; display:flex; }
  .search-wrapper { width:auto; flex:1; margin-left:15px; }
  .top-action span { display:none; }
  .top-action { width:36px; padding:0; }
  .sidebar { display:none; position:absolute; top:62px; left:0; bottom:0; z-index:22; width:min(80vw,300px); box-shadow:10px 0 25px color-mix(in srgb,var(--color-shadow) 15%,transparent); }
  .sidebar.mobile-open { display:flex; }
  .mobile-shade { display:block; position:fixed; inset:62px 0 0; background:var(--color-overlay-background); opacity:.65; z-index:20; }
  .content { width:100%; }
  .doc-article { padding:30px 26px; }
  .title-rule { margin:0 -26px 24px; }
  h1 { font-size:46px; }
}
@media (max-width:570px) {
  .topbar { height:58px; padding-right:9px; }
  .brand { font-size:15px; gap:3px; padding-left:8px; }
  .brand-second { display:none; }
  .brand .mobile-menu { margin-right:3px; }
  .search-wrapper { margin-left:10px; height:36px; padding:0 9px; min-width:0; flex:1 1 0; }
  .search-wrapper input { font-size:12px; }
  .search-wrapper kbd { display:none; }
  .topbar-actions { gap:5px; margin-left:8px; }
  .top-action { width:33px; height:33px; }
  .app-main { height:calc(100vh - 58px); }
  .sidebar { top:58px; }
  .mobile-shade { top:58px; }
  .doc-article { padding:29px 18px; }
  .article-title-row { min-height:79px; }
  .title-rule { margin:0 -18px 23px; }
  h1 { font-size:40px; }
  .edit-button { font-size:0; width:34px; height:34px; padding:0; }
  .doc-intro,.doc-paragraph { font-size:14px; }
  .doc-section h2 { font-size:26px; }
  .code-block pre { font-size:12px; }
  .stage-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .stage-heading { font-size:22px; }
  .stage-completed { font-size:11px; }
  .drawer-top { padding:20px; height:85px; }
  .drawer-tabs { padding:0 19px 13px; }
  .drawer-scroll { padding:18px 19px 28px; }
  .drawer-bottom { padding:12px 19px; }
  .drawer-bottom > span { display:none; }
  .drawer-bottom .bottom-actions { margin-left:auto; }
  .editor-form-grid { grid-template-columns:1fr; gap:0; }
  .color-fields { grid-template-columns:1fr; }
  .color-field { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .color-name { margin:0; }
  .color-controls { width:155px; }
}

/* V2: semantic colors, connected article scroll and development UI. */
.code-block pre { color: var(--color-code-default); }
.tok-flow-keyword { color: var(--color-code-flow-keyword); }
.tok-binding-node { color: var(--color-code-binding-node); }
.tok-invalid { color: var(--color-code-invalid); }
.tok-keyword { color: var(--color-code-keyword); }
.tok-type { color: var(--color-code-type); }
.tok-number { color: var(--color-code-number); }
.tok-comment { color: var(--color-code-comment); }
.tok-string { color: var(--color-code-string); }
.tok-function { color: var(--color-code-function); }
.tok-operator { color: var(--color-code-operator); }

.group-row { display:flex; align-items:center; min-height:27px; }
.group-choice {
  flex:1; border:0; background:transparent; color:var(--color-text-primary);
  text-align:left; font-weight:740; font-size:15px; padding:4px 0;
}
.group-choice.category-active { color:var(--color-accent); }
.group-collapse { border:0; background:transparent; color:var(--color-text-secondary); padding:5px; display:flex; }

.lazy-document { scroll-margin-top:0; }
.lazy-document + .lazy-document { border-top:1px solid var(--color-border); }
.lazy-document .doc-article { padding-bottom:36px; }
.lazy-placeholder {
  min-height:360px; max-width:1020px; margin:0 auto; display:flex;
  align-items:flex-start; padding:72px 45px; color:var(--color-text-muted);
  font-size:23px; font-weight:650;
}
.doc-section { scroll-margin-top:18px; }
.doc-paragraph,.doc-intro,.doc-notice span { white-space:pre-wrap; tab-size:4; overflow-wrap:anywhere; }
.doc-paragraph a,.doc-intro a,.doc-notice a {
  color:var(--color-accent); text-decoration:underline; text-underline-offset:3px;
}
.doc-notice {
  --notice-color: var(--color-notice-info);
  border-left:3px solid var(--notice-color);
  color:var(--color-text-secondary);
  background:color-mix(in srgb,var(--notice-color) 11%,var(--color-surface-background));
  padding:11px 15px; margin:12px 0 18px; border-radius:3px 7px 7px 3px;
  line-height:1.7; font-size:14px; display:flex; flex-direction:column; gap:2px;
}
.doc-notice strong { color:var(--notice-color); font-size:13px; text-transform:uppercase; letter-spacing:.4px; }
.notice-info { --notice-color:var(--color-notice-info); }
.notice-warning { --notice-color:var(--color-notice-warning); }
.notice-deprecated { --notice-color:var(--color-notice-deprecated); }
.notice-experimental { --notice-color:var(--color-notice-experimental); }
.notice-tip { --notice-color:var(--color-notice-tip); }
.doc-notice + .doc-intro { margin-top:16px; }
.stage-grid { grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); }
.status-readonly { font-size:12px; color:var(--color-text-secondary); }
.save-indicator {
  border:1px solid transparent; background:transparent;
  color:var(--color-text-muted); padding:5px 10px; border-radius:6px; font-size:11px;
}
.save-indicator.error { color:var(--color-danger); border-color:var(--color-danger); }
.save-indicator.saving { color:var(--color-accent); }
.status-group-editor {
  border:1px solid var(--color-border); border-radius:10px;
  background:var(--color-surface-background); padding:16px; margin:18px 0;
}
.status-group-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
.status-group-heading h3 { font-size:17px; margin:0; }
.stage-subheading { font-size:13px; margin:22px 0 10px; }
.editor-check-row {
  display:flex; align-items:center; gap:10px; color:var(--color-text-secondary);
  font-size:13px; line-height:1.6; margin:9px 0 14px; cursor:pointer;
}
.editor-check-row input { accent-color:var(--color-accent); width:15px; height:15px; }
.inline-format-tools { display:flex; flex-wrap:wrap; gap:5px; margin:-3px 0 14px; }
.inline-format-tools .button { padding:0 9px; font-size:11px; height:30px; }
.inline-format-tools select {
  border:1px solid var(--color-border); border-radius:7px;
  background:var(--color-input-background); color:var(--color-text-primary);
  font-size:11px; max-width:175px; min-width:100px; height:30px; padding:3px 5px;
}
@media(max-width:1000px) {
  .save-indicator { display:none; }
}

.reader-theme-switch {
  margin-left:auto; display:flex; align-items:center; gap:7px; border:1px solid var(--color-border);
  background:var(--color-surface-background); color:var(--color-text-secondary);
  padding:8px 11px; border-radius:7px; font-size:12px; font-weight:650;
}
.reader-theme-switch:hover { color:var(--color-text-primary); background:var(--color-surface-hover); }
@media(max-width:570px) { .reader-theme-switch span { display:none; } .reader-theme-switch { padding:7px; } }

/* Full-text search dropdown. */
.search-results {
  position:absolute;
  top:calc(100% + 9px);
  left:0;
  width:min(620px,calc(100vw - 32px));
  max-height:min(68vh,620px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  border:1px solid var(--color-border);
  border-radius:10px;
  background:var(--color-sidebar-background);
  box-shadow:0 18px 48px color-mix(in srgb,var(--color-shadow) 28%,transparent);
  z-index:60;
}
.search-results-header {
  display:flex;
  justify-content:space-between;
  gap:16px;
  padding:10px 13px;
  border-bottom:1px solid var(--color-border);
  color:var(--color-text-muted);
  font-size:10px;
  font-weight:750;
  letter-spacing:.65px;
  text-transform:uppercase;
}
.search-results-list {
  overflow-y:auto;
  min-height:0;
  scrollbar-color:var(--color-border) transparent;
  scrollbar-width:thin;
}
.search-result {
  display:block;
  width:100%;
  border:0;
  border-bottom:1px solid color-mix(in srgb,var(--color-border) 72%,transparent);
  background:transparent;
  color:var(--color-text-primary);
  text-align:left;
  padding:11px 13px 12px;
}
.search-result:last-child { border-bottom:0; }
.search-result:hover,.search-result:focus-visible {
  background:var(--color-surface-hover);
  outline:0;
}
.search-result-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:3px;
}
.search-result-top strong {
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
}
.search-result-top span {
  flex:0 0 auto;
  color:var(--color-text-muted);
  font-size:10px;
}
.search-result-context {
  color:var(--color-accent);
  font-size:11px;
  font-weight:650;
  margin-bottom:4px;
}
.search-result-snippet {
  color:var(--color-text-secondary);
  font-size:11px;
  line-height:1.45;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}
.search-results-empty {
  padding:18px 14px;
  color:var(--color-text-muted);
  font-size:12px;
  line-height:1.55;
}

@media(max-width:570px) {
  .search-results {
    position:fixed;
    top:58px;
    left:8px;
    right:8px;
    width:auto;
    max-height:62vh;
  }
}
</style>

  <script>window.EXDOT_DEV = false;
window.EXDOT_PROJECT = {"version": 2, "themeMode": "dark", "colors": {"dark": {"appBackground": "#1c1e22", "headerBackground": "#272a31", "sidebarBackground": "#272a31", "surfaceBackground": "#25282f", "surfaceRaised": "#2c3039", "surfaceHover": "#343944", "shadow": "#000000", "inputBackground": "#1e2026", "border": "#393d48", "overlayBackground": "#080c13", "textPrimary": "#f7f7f9", "textSecondary": "#bcbfc8", "textMuted": "#9399a4", "accent": "#b2c5ff", "accentHover": "#cad6ff", "onAccent": "#1d294a", "selectionBackground": "#b2c5ff", "selectionText": "#202b4a", "danger": "#f08d8d", "codeBackground": "#272a31", "codeBorder": "#383c47", "codeDefault": "#ffffff", "codeKeyword": "#ff7c9b", "codeFlowKeyword": "#f299f2", "codeString": "#e6cc73", "codeComment": "#8c8c8c", "codeFunction": "#b34dff", "codeType": "#00ca00", "codeNumber": "#b3ffcc", "codeBindingNode": "#5b8dfd", "codeOperator": "#80ccff", "codeInvalid": "#ff664d", "codeSelection": "#435879", "statusDone": "#76d9b1", "statusActive": "#9db8ff", "statusPlanned": "#969eae", "statusBlocked": "#f09c96", "noticeInfo": "#81baff", "noticeWarning": "#f0bd72", "noticeDeprecated": "#eb9a9a", "noticeExperimental": "#c6a3ff", "noticeTip": "#74d7ae"}, "light": {"appBackground": "#f8f9fd", "headerBackground": "#ffffff", "sidebarBackground": "#f1f3f9", "surfaceBackground": "#ffffff", "surfaceRaised": "#eef1fa", "surfaceHover": "#e5eaf5", "shadow": "#324166", "inputBackground": "#ffffff", "border": "#dbe0eb", "overlayBackground": "#263043", "textPrimary": "#20273a", "textSecondary": "#525e75", "textMuted": "#7a8498", "accent": "#416bd8", "accentHover": "#2c4fb6", "onAccent": "#ffffff", "selectionBackground": "#dce5ff", "selectionText": "#284c9a", "danger": "#ca4545", "codeBackground": "#f0f3f9", "codeBorder": "#d9e0eb", "codeDefault": "#273044", "codeKeyword": "#bc3154", "codeFlowKeyword": "#9c3b9c", "codeString": "#886115", "codeComment": "#717987", "codeFunction": "#7822b5", "codeType": "#207b2c", "codeNumber": "#17784d", "codeBindingNode": "#245bc4", "codeOperator": "#146eae", "codeInvalid": "#bc3022", "codeSelection": "#c8d8fb", "statusDone": "#188365", "statusActive": "#3d6bce", "statusPlanned": "#7e8798", "statusBlocked": "#be5353", "noticeInfo": "#2967a5", "noticeWarning": "#996414", "noticeDeprecated": "#b04444", "noticeExperimental": "#7e42bc", "noticeTip": "#187d58"}}, "statusGroups": [{"id": "implementation", "title": "Implementation status", "description": "Progress across compiler development stages", "stages": [{"id": "lexer", "name": "Lexer", "description": "Source-code tokenization"}, {"id": "highlighter", "name": "Base Highlighter", "description": "Syntax highlighting in the editor"}, {"id": "parser", "name": "Parser", "description": "Grammar and syntax tree"}, {"id": "semantic", "name": "Semantic analysis", "description": "Type checks and semantic rules"}, {"id": "codegen", "name": "Codegen", "description": "Target-code generation"}, {"id": "stage-mwmduxfv-2wl8o", "name": "Analyzed Highlighter", "description": ""}]}], "docs": [{"id": "doc-mwmesr87-qdk7i", "category": "Identifiers", "title": "func", "summary": "Functions in Exdot are reusable blocks of code defined with the `func` keyword. They help organize your game logic and prevent code repetition. They are very similar to GDScript's functions, with some important differences; Functions in Exdot do not respond to game events. There is also a special Syntax to share references instead of values with functions. You can check out all existing functions [here](doc:doc-mwmfyard-8mj4t)", "notices": [], "statusGroupIds": ["implementation"], "progress": {"implementation": {"lexer": "done", "highlighter": "active"}}, "sections": [{"visible": true, "id": "sec-mwmesr87-hheby", "heading": "Syntax", "kind": "code", "content": "# A simple function\nfunc hello() -> Void:\n\tprint(\"Hello World!\")\n\nhello() # Call the function\n\n# A function with a declared parameter\nfunc hello(message: String) -> Void:\n\tprint(message) # Hello World!\n\nhello(\"Hello World!\")\n\n# A function called with shared references\nfunc hello(*message: String) -> Void:\n\tmessage = \"Bye World!\"\n\nvar param1 := \"Hello World!\"\nhello(*param1)\nprint(param1) # Bye World!\n# This only works with shared references! Normal behaviour would not change the value from param1!"}]}, {"id": "doc-mwnpd7uj-nhdwp", "category": "Identifiers", "title": "hoist", "summary": "`hoist` is an Exdot unique identifier. It is very similar to functions but has a limited scope and can only be executed from a specific declared position. It is used in combination with the [hoisted](doc:doc-mwnpuslk-bhv4j) keyword and can only be used inside of functions.", "notices": [{"id": "notice-mwnpg64n-4pzrk", "kind": "experimental", "title": "Experimental", "text": "`hoist` is a new way to organize code. As of now it is very experimental and may change in syntax or be removed entirely."}], "statusGroupIds": ["implementation"], "progress": {"implementation": {"lexer": "done"}}, "sections": [{"visible": true, "id": "sec-mwnpd7uj-qm2xm", "heading": "Syntax", "kind": "code", "content": "func some_function() -> Void:\n\tvar xyz := 123\n\tvar age := 21\n\thoist abc(xyz)\n\nhoisted abc(xyz: Number) -> Void:\n\tprint(xyz) # 123\n\tprint(age) # ReferenceError: hoisted `abc` has no access to the declared variable `age`\n\nfunc another_function() -> Void:\n\thoist abc(123) # InvalidHoist: `abc` is already hoisted by another function!\n\nhoist abc(123) # InvalidHoist: Cannot hoist outside of a function!"}]}, {"id": "doc-mwnpuslk-bhv4j", "category": "Identifiers", "title": "hoisted", "summary": "`hoisted` is an Exdot unique identifier. It is used to declare a `hoist` in a function alike syntax.\n`hoisted` can only be used outside of functions.\nIf you do not know [hoist](doc:doc-mwnpd7uj-nhdwp), than you should read about it first.", "notices": [{"id": "notice-mwnq82mq-8a60e", "kind": "experimental", "title": "Experimental", "text": "`hoisted` is a new way to organize code. As of now it is very experimental and may change in syntax or be removed entirely."}], "statusGroupIds": ["implementation"], "progress": {"implementation": {"lexer": "done"}}, "sections": [{"visible": true, "id": "sec-mwnpuslk-nm7ed", "heading": "Syntax", "kind": "code", "content": "hoisted hello_world() -> String:\n\treturn \"Hello World!\"\n\nexport hoisted hello_world() -> String:\n\treturn \"Hello World!\"\n\nhoist hello_world(message: String) -> String:\n\treturn  \"new message: %s\" % [message]\n\nhoist hello_world(*message: String) -> Void:\n\tmessage = \"Hello World!\""}]}, {"id": "doc-mwpd2ykm-w0mc7", "category": "Identifiers", "title": "node", "summary": "`node` is a declarative keyword used to declare a `NodeSelection` from the scene tree or to create a new `Node` instance.", "notices": [], "statusGroupIds": ["implementation"], "progress": {"implementation": {"lexer": "done"}}, "sections": [{"visible": true, "id": "sec-mwpd2ykm-qlxx4", "heading": "", "kind": "code", "content": "node Player := <CharacterBody3D>\nnode timer := Timer { ... options }"}, {"visible": true, "id": "sec-mwpdbrau-scjma", "kind": "text", "heading": "", "content": "take a look at all [Nodes](doc:doc-mwpa030x-rvr2t)."}]}, {"id": "doc-mwnp7jgv-6ylyz", "category": "Identifiers", "title": "on", "summary": "`on` is a keyword to bind game events. It is followed with the name of an Event and is executed when the Events conditions have been met. You can see all Events [here](doc:doc-mwnp2a3w-lg7k1).", "notices": [], "statusGroupIds": ["implementation"], "progress": {"implementation": {"lexer": "done"}}, "sections": [{"visible": true, "id": "sec-mwnp7jgv-rii1m", "heading": "Syntax", "kind": "code", "content": "on EventTarget:ready() -> Void:\n\tprint(\"Node ready!\")"}, {"id": "sec-mwqdksr3-xai3k", "kind": "text", "heading": "", "content": "read [EventTarget](doc:doc-mwp9sqgs-zwlhs) for more Informations.", "visible": true}]}, {"id": "readonly", "category": "Identifiers", "title": "readonly", "summary": "`readonly` marks a variable or property as assign-once. It communicates intent to readers and gives the compiler enough information to reject later writes. Unlike Godot's implementation of `const`, `readonly` allows to be initialized by expressions which aren't explicitly constant.", "notices": [], "statusGroupIds": ["implementation"], "progress": {"implementation": {"highlighter": "done", "lexer": "done", "parser": "planned", "semantic": "planned", "codegen": "planned"}}, "sections": [{"visible": true, "id": "syntax", "heading": "Syntax", "kind": "code", "content": "readonly var max_health: Int = 100\nreadonly var scene_name := \"Main\"\nreadonly var dict := {\n\t\"name\": \"John\"\n}\nreadonly var array := [\"Doe\"]"}, {"visible": true, "id": "init-note", "heading": "", "kind": "text", "content": "The initializer is evaluated once. A later assignment is invalid:"}, {"visible": true, "id": "error-syntax", "heading": "", "kind": "code", "content": "max_health = 120 # Error: cannot assign to readonly binding\ndict.name = \"Mike\" # Error: cannot assign new properties on readonly dictionaries\narray.pop_front() # Error: cannot modify readonly Array"}, {"visible": true, "id": "immutability", "heading": "", "kind": "text", "content": "`readonly` prevents reassignment of the binding; it does not automatically make an object or collection deeply immutable."}]}, {"id": "var", "category": "Identifiers", "title": "var", "summary": "The `var` statement declares function-scoped or globally-scoped variables, optionally initializing each to a value.", "notices": [], "statusGroupIds": ["implementation"], "progress": {"implementation": {"lexer": "done"}}, "sections": [{"visible": true, "id": "var-syntax", "heading": "Syntax", "kind": "code", "content": "var current_health : Int\nvar current_health: Int = 100\nvar current_health := 100"}, {"visible": true, "id": "sec-mwmebm9t-g5cij", "kind": "text", "heading": "Description", "content": "The scope of a variable declared with `var` is dependent of it's placement inside your file.\nBelow you can see an example on how scope with `var` works.\nYou can also protect your variable from changes. Read [readonly](doc:readonly) for that."}, {"visible": true, "id": "sec-mwmei2ua-a38ix", "kind": "code", "heading": "Example", "content": "func foo() -> Void:\n\tvar x := 1\n\tfunc bar() -> Void:\n\t\tvar y := 2\n\t\tprint(x) # 1 -> func `bar()` has access to the scope of `foo()` and therefore also access to `x`\n\t\tprint(y) # 2 -> `y` is in scope\n\t\n\tbar()\n\tprint(x) # 1 -> `x` is in scope of `foo()`\n\tprint(y) # ReferenceError: `y` is scoped to `bar()`\n\nfoo()"}]}, {"id": "doc-mwmfyard-8mj4t", "category": "Functions", "title": "print", "summary": "`print` is the standard way to write values to the output console.", "notices": [], "statusGroupIds": ["implementation"], "progress": {"implementation": {"lexer": "done"}}, "sections": [{"visible": true, "id": "sec-mwmfyard-gsoxu", "heading": "Call Signature", "kind": "code", "content": "print(...args: Variant) -> Void"}, {"visible": true, "id": "sec-mwmgpknm-095c1", "kind": "text", "heading": "Parameters", "content": "`args`\n- One or more values to print. Each argument may have any type."}, {"visible": true, "id": "sec-mwmgfjzc-p7u77", "kind": "code", "heading": "Syntax", "content": "print(\"Hello World!\") # prints Hello World!\nprint(123) # prints 123\n\n# Printing with declared variables:\nvar x := \"Hello World!\"\nprint(x)\n\n# Can print multiple values:\nprint(x, 123) # Hello World!123"}]}, {"id": "doc-mwpbcopc-jxqrg", "category": "Types", "title": "Bool", "summary": "`Bool` is a type that may only store one of two values: `true` or `false`. It is used to decide if something should run or not. You can see an example below:", "notices": [], "statusGroupIds": ["implementation"], "progress": {}, "sections": [{"visible": true, "id": "sec-mwpbcopc-x80ul", "heading": "", "kind": "code", "content": "var can_print = true\nif can_print:\n\tprint(\"Hello World!\")"}]}, {"id": "doc-mwp9sqgs-zwlhs", "category": "Types", "title": "EventTarget", "summary": "`EventTarget` inherits from [Node](doc:doc-mwpa030x-rvr2t). It represents the need of a `Node` to target with an [Event](doc:doc-mwnp2a3w-lg7k1). Event Targets are typically documented as followed:", "notices": [], "statusGroupIds": ["implementation"], "progress": {"implementation": {"lexer": "planned"}}, "sections": [{"visible": true, "id": "sec-mwpa6aqk-w6ary", "kind": "code", "heading": "", "content": "on EventTarget:ready() -> Void\non EventTarget:enter_tree() -> Void"}, {"visible": true, "id": "sec-mwpa82fb-wz5pw", "kind": "text", "heading": "", "content": "`EventTarget` has to be replaced with a valid target.\nA valid use of `EventTarget` could look like this:"}, {"visible": true, "id": "sec-mwpa9o9v-atulu", "kind": "code", "heading": "", "content": "node Player := <CharacterBody3D>\n\non Player:ready() -> Void:\n\tprint(\"Player ready\")"}, {"visible": true, "id": "sec-mwp9sqgs-vckyo", "heading": "Example of valid Event Targets", "kind": "code", "content": "Node\nNode2D\nCharacterBody2D\nCharacterBody3D\nCamera3D\n# and many more"}]}, {"id": "doc-mwmddzhs-gwf7w", "category": "Types", "title": "Float", "summary": "`Float` represents numbers with decimal points, called Floats.", "notices": [{"id": "notice-mwmdjd27-qsffw", "kind": "info", "title": "Info", "text": "Some numbers are not correctly represented in the documentation. This will be updated."}], "statusGroupIds": ["implementation"], "progress": {"implementation": {"lexer": "done"}}, "sections": [{"visible": true, "id": "sec-mwmddzhs-yojct", "heading": "Example of valid Floats", "kind": "code", "content": "123.45\n0.5\n1_000.25 # 1000.25\n1e10 # 10000000000.0\n1E10 # 10000000000.0\n1e+10 # 10000000000.0\n1e-10 # 0.0000000001\n1.5e10 # 15000000000.0\n1.5e-3 # 0.0015"}]}, {"id": "doc-mwpbwvsz-5qbi7", "category": "Types", "title": "InputEvent", "summary": "`InputEvent` is the type for the abstract base class for input events. See [EventTarget:Input()](doc:doc-mwpbsjuy-3sh6z) for more details.", "notices": [], "statusGroupIds": ["implementation"], "progress": {}, "sections": []}, {"id": "doc-mwmczqfa-82z51", "category": "Types", "title": "Int", "summary": "`Int` represents numbers without decimal points, called Integers.", "notices": [{"id": "notice-mwmdbvk2-7d4bk", "kind": "info", "title": "Info", "text": "Some numbers are not correctly represented in the documentation. This will be updated."}], "statusGroupIds": ["implementation"], "progress": {"implementation": {"highlighter": "planned", "lexer": "done"}}, "sections": [{"visible": true, "id": "sec-mwmczqfa-tjjvm", "heading": "Example of valid Integers", "kind": "code", "content": "123\n1_000 # 1000\n0xFF # 255\n0xff # also 255\n0xDEAD_BEEF # 3735928559"}]}, {"id": "doc-mwmkcrhk-yf0n8", "category": "Types", "title": "Number", "summary": "`Number` is a combination of integer and float. It allows for both.\nSee [Integers](doc:doc-mwmczqfa-82z51#sec-mwmczqfa-tjjvm) and [Floats](doc:doc-mwmddzhs-gwf7w#sec-mwmddzhs-yojct) for examples.", "notices": [], "statusGroupIds": ["implementation"], "progress": {"implementation": {"lexer": "done"}}, "sections": []}, {"id": "doc-mwnqcum6-abymd", "category": "Types", "title": "String", "summary": "a `String` is a data type used to represent text, stored as an ordered sequence of characters inside quotation marks.", "notices": [{"id": "notice-mwnqwzc5-5103p", "kind": "info", "title": "Info", "text": "At this moment, there is no multi-line String. This will be added later."}], "statusGroupIds": ["implementation"], "progress": {"implementation": {"lexer": "done"}}, "sections": [{"visible": true, "id": "sec-mwnqcum6-scncw", "heading": "Example of valid Strings", "kind": "code", "content": "\"Hello World!\" # double quotations\n'Hello World!' # single quotations\n\"new\\nline\" # `\\n` is an escape sequence. It represents a visible newline\n\"tab\\tline\" # `\\t` is an escape sequence. It represents a Tab\n\"carriage return\\rline\" # `\\r` is an escape sequence. It represents a carriage return\n\"escaped backslash \\\\ line\" # `\\\\` is an escape sequence. It leaves the `\\` char, which would normale escape the String, as an actual character of the string\n\"Hello \\\"World!\\\"\" # `\\\"` is an escape sequence. It is used to display quotation marks inside Strings, which would normally end the String\n'Hello \"World\"' # A different way to use quotation marks without needing to escape the quotation character. This works because The String can and must be closed only by the same character used to open the String."}]}, {"id": "doc-mwmkfser-aw3z1", "category": "Types", "title": "Variant", "summary": "`Variant` is a flexible type contraint. It allows declared variables with this type to freely change to another type.", "notices": [{"id": "notice-mwmkguon-map2k", "kind": "warning", "title": "Info", "text": "It is not recommended to use Variant as long as it is not explicitly needed."}], "statusGroupIds": ["implementation"], "progress": {"implementation": {"lexer": "done"}}, "sections": [{"visible": true, "id": "sec-mwmkfser-is51y", "heading": "Syntax", "kind": "code", "content": "var x : Variant = \"Hello World!\"\nx = 123 # Valid!"}]}, {"id": "doc-mwnor7s5-9fl3p", "category": "Types", "title": "Void", "summary": "in Exdot, a `Void` return type means a function performs an action without sending any value back to the code that called it. `Void` cannot be the value of a Variable as it is only a return type.", "notices": [], "statusGroupIds": ["implementation"], "progress": {"implementation": {"lexer": "done"}}, "sections": [{"visible": true, "id": "sec-mwnor7s6-pk8yv", "heading": "Syntax", "kind": "code", "content": "func multiply(x: Number, y: Number) -> Void:\n\treturn x * y # A Void function cannot return a value!\n\treturn # valid, no value after the return keyword\n\treturn null # Also not allowed!"}]}, {"id": "doc-mwpdeocx-mhi9e", "category": "Classes", "title": "Timer", "summary": "A `Timer` is the simplest way to handle time-based logic in the engine. It is however not recommended to be used for very low wait times like 0.5 seconds and below.\nRead [Godot's Documentation](https://docs.godotengine.org/en/stable/classes/class_timer.html) for a more detailed explanation. The Syntax might vary.\n", "notices": [], "statusGroupIds": ["implementation"], "progress": {}, "sections": [{"visible": true, "id": "sec-mwpdeocx-ontsv", "heading": "Syntax", "kind": "code", "content": "# NodeSelection\nnode timer := <Timer>\n\n# NodeCreation\nnode timer := Timer {\n\tautostart = false,\n\tpaused = true,\n\tone_shot = true,\n\twait_time = 1.0\n}"}, {"visible": true, "id": "sec-mwpdlmxn-mfdih", "kind": "code", "heading": "Properties", "content": "Bool  autostart\t\t\t\t\t\t\t# [Default: false]\nBool  ignore_time_scale \t\t\t\t# [Default: false]\nBool  one_shot\t\t\t\t\t\t\t# [Default: false]\nBool  paused\t\t\nTimerProcessCallback  process_callback\t# [Default: 1]\nFloat  readonly time_left\nFloat  wait_time\t\t\t\t\t\t# [Default: 1.0]"}, {"visible": true, "id": "sec-mwpdv89a-lmbl1", "kind": "code", "heading": "Methods", "content": "Bool is_stopped()\nVoid start(time_sec?: Float)\nVoid stop()"}, {"visible": true, "id": "sec-mwpel42u-alx15", "kind": "code", "heading": "Event Signatures", "content": "# timeout() is emitted when the Timer was started and the time ran out.\non EventTarget:timeout() -> Void"}]}, {"id": "doc-mwqean6j-y3rbl", "category": "Nodes", "title": "AudioListener3D", "summary": "`AudioListener3D` overrides the location, sounds are heard from.\nBy using `make_current()`, this node will override the location, which can be used to listen from a location different from the Camera3D.", "notices": [], "statusGroupIds": ["implementation"], "progress": {}, "sections": [{"id": "sec-mwqf6193-nbw7q", "kind": "text", "heading": "", "content": "inherits as a direct, immediate neighbor of [Node3D](doc:doc-mwqe0gf0-p4rbn).", "visible": true}]}, {"id": "doc-mwqefxjz-4gkqk", "category": "Nodes", "title": "AudioStreamPlayer3D", "summary": "`AudioStreamPlayer3D` plays positional sound in 3D space.\nBy default, audio is heard from the camera position. This can be changed by adding an [AudioListener3D](doc:doc-mwqean6j-y3rbl) node to the scene and enabling it.", "notices": [], "statusGroupIds": ["implementation"], "progress": {}, "sections": [{"id": "sec-mwqf5lxg-l4oum", "kind": "text", "heading": "", "content": "inherits as a direct, immediate neighbor of [Node3D](doc:doc-mwqe0gf0-p4rbn).", "visible": true}]}, {"id": "doc-mwqen3p7-868y1", "category": "Nodes", "title": "BoneAttachment3D", "summary": "`BoneAttachment3D` is a [Node](doc:doc-mwpa030x-rvr2t) that dynamically copies or overrides the 3D transform of a selected bone in its parent Skeleton3D.", "notices": [], "statusGroupIds": ["implementation"], "progress": {}, "sections": [{"id": "sec-mwqf40d4-qy37s", "kind": "text", "heading": "", "content": "inherits as a direct, immediate neighbor of [Node3D](doc:doc-mwqe0gf0-p4rbn).", "visible": true}]}, {"id": "doc-mwqerm9f-m6w63", "category": "Nodes", "title": "Camera3D", "summary": "`Camera3D` is a special [Node](doc:doc-mwpa030x-rvr2t) that displays what is visible from its current location. Cameras register themselves in the nearest viewport node. Only one camera can be active per viewport.", "notices": [], "statusGroupIds": ["implementation"], "progress": {}, "sections": [{"id": "sec-mwqf3oh4-zvh7t", "kind": "text", "heading": "", "content": "inherits as a direct, immediate neighbor of [Node3D](doc:doc-mwqe0gf0-p4rbn).", "visible": true}]}, {"id": "doc-mwqf7to8-21slv", "category": "Nodes", "title": "CollisionPolygon3D", "summary": "`CollisionPolygon3D` provides a thickened polygon shape (a prism) to a CollisionObject3D parent and allows it to be edited.", "notices": [], "statusGroupIds": ["implementation"], "progress": {}, "sections": [{"id": "sec-mwqf7to9-m4gys",   <script>
/* Full-text search helpers for documentation entries and their sections. */
(function (Exdot) {
  'use strict';

  function plainText(value) {
    return String(value || '')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function scoreMatch(text, query, baseScore) {
    const haystack = plainText(text).toLowerCase();
    if (!haystack) return null;

    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length || !terms.every(term => haystack.includes(term))) return null;

    const first = haystack.indexOf(terms[0]);
    let score = baseScore;
    if (haystack === query.toLowerCase()) score += 120;
    else if (haystack.startsWith(query.toLowerCase())) score += 70;
    else if (haystack.includes(query.toLowerCase())) score += 40;
    score -= Math.max(0, first) * 0.02;
    return score;
  }

  function snippet(text, query, radius = 72) {
    const source = plainText(text);
    if (!source) return '';

    const lower = source.toLowerCase();
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    const positions = terms
      .map(term => lower.indexOf(term))
      .filter(index => index >= 0);
    const matchAt = positions.length ? Math.min(...positions) : 0;
    const start = Math.max(0, matchAt - radius);
    const end = Math.min(source.length, matchAt + query.length + radius);
    return (start > 0 ? '…' : '') + source.slice(start, end) + (end < source.length ? '…' : '');
  }

  function searchDocumentation(docs, rawQuery, limit = 18) {
    const query = String(rawQuery || '').trim();
    if (!query) return [];

    const results = [];

    (docs || []).forEach(doc => {
      const titleScore = scoreMatch(doc.title, query, 500);
      const summaryScore = scoreMatch(doc.summary, query, 260);
      const categoryScore = scoreMatch(doc.category, query, 180);

      if (titleScore !== null || summaryScore !== null || categoryScore !== null) {
        results.push({
          key: 'doc:' + doc.id,
          docId: doc.id,
          sectionId: null,
          category: doc.category,
          title: doc.title,
          context: 'Entry',
          snippet: summaryScore !== null ? snippet(doc.summary, query) : plainText(doc.summary),
          score: Math.max(titleScore ?? -Infinity, summaryScore ?? -Infinity, categoryScore ?? -Infinity)
        });
      }

      (doc.notices || []).forEach(notice => {
        const text = [notice.title, notice.text].filter(Boolean).join(' ');
        const matchScore = scoreMatch(text, query, 190);
        if (matchScore === null) return;
        results.push({
          key: 'notice:' + doc.id + ':' + notice.id,
          docId: doc.id,
          sectionId: null,
          category: doc.category,
          title: doc.title,
          context: notice.title || 'Notice',
          snippet: snippet(text, query),
          score: matchScore
        });
      });

      (doc.sections || []).forEach(section => {
        if (section.visible === false) return;
        const headingScore = scoreMatch(section.heading, query, 360);
        const contentScore = scoreMatch(section.content, query, section.kind === 'code' ? 230 : 250);
        if (headingScore === null && contentScore === null) return;

        results.push({
          key: 'section:' + doc.id + ':' + section.id,
          docId: doc.id,
          sectionId: section.id,
          category: doc.category,
          title: doc.title,
          context: section.heading || (section.kind === 'code' ? 'Code example' : 'Content'),
          snippet: snippet(section.content || section.heading, query),
          score: Math.max(headingScore ?? -Infinity, contentScore ?? -Infinity)
        });
      });
    });

    return results
      .sort((a, b) => b.score - a.score || a.title.localeCompare(b.title))
      .slice(0, limit);
  }

/* Lightweight syntax highlighting. Names are derived from documented articles. */

  'use strict';

  const { h } = Exdot;

  // Flow control is language syntax, not an individually documented declaration.
  // All documented identifiers, functions, types, and classes come from JSON.
  const FLOW_KEYWORDS = new Set([
    'return', 'if', 'else', 'while', 'for', 'break', 'continue',
    'match', 'and', 'or', 'not', 'switch', 'case', 'yield', 'throw',
    'try', 'catch'
  ]);

  const CATEGORY_TOKENS = {
    Identifiers: 'keyword',
    Functions: 'function',
    Types: 'type',
    Classes: 'type', // Exdot's TYPE color also applies to documented classes.
    Nodes: 'type',
    Literals: 'keyword',
    Enums: 'type',
  };

  const TOKEN_RE = /\/\/[^\n]*|#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b\d+(?:\.\d+)?\b|[A-Za-z_][\w]*|[=:+\-*/%<>!&|^~?]+|[(){}\[\],.;]|\s+|./g;
  const IDENTIFIER_RE = /^[A-Za-z_][A-Za-z_0-9]*$/;

  function symbolFromTitle(title) {
    const trimmed = String(title || '').trim();
    if (IDENTIFIER_RE.test(trimmed)) return trimmed;

    // A documented signature such as "print(value)" defines the symbol "print".
    const signature = /^([A-Za-z_][A-Za-z_0-9]*)\s*\(/.exec(trimmed);
    return signature ? signature[1] : null;
  }

  function createSymbolTable(docs) {
    const symbols = new Map();
    for (const doc of Array.isArray(docs) ? docs : []) {
      const type = CATEGORY_TOKENS[doc.category];
      const symbol = symbolFromTitle(doc.title);
      if (type && symbol) symbols.set(symbol, type);
    }
    return symbols;
  }

  function tokenType(value, code, start, end, symbols) {
    if (/^#|^\/\//.test(value)) return 'comment';
    if (/^['"]/.test(value)) return 'string';
    if (/^\d/.test(value)) return 'number';

    if (IDENTIFIER_RE.test(value)) {
      // Explicit documentation wins over lexical heuristics.
      if (symbols.has(value)) return symbols.get(value);
      if (FLOW_KEYWORDS.has(value)) return 'flow-keyword';

      const following = code.slice(end).trimStart();
      if (following.startsWith('(')) return 'function';
      return 'binding-node';
    }

    if (/^[=:+\-*/%<>!&|^~?]+$/.test(value)) return 'operator';
    return null;
  }

    const code = String(source || '');
    const symbols = symbolTable instanceof Map ? symbolTable : new Map();
    const tokens = [];
    let match;

    TOKEN_RE.lastIndex = 0;
    while ((match = TOKEN_RE.exec(code)) !== null) {
      const start = match.index;
      const type = tokenType(match[0], code, start, TOKEN_RE.lastIndex, symbols);
      tokens.push(type
        ? h('span', { className: `tok-${type}`, key: start }, match[0])

    textarea.value = code;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';

    document.body.appendChild(textarea);
    textarea.select();

    try {
      document.execCommand('copy');
      onCopy?.();
    } catch (error) {
      // Clipboard access can be unavailable in some offline environments.
    } finally {
      textarea.remove();
    }

      if (navigator.clipboard?.writeText) {

          .then(() => onCopy?.())
          .catch(() => copyFallback(text, onCopy));
      } else {
        copyFallback(text, onCopy);
      }

    return h('div', { className: 'code-block' },
      h('button', {
        className: 'code-copy',
        type: 'button',
        title: 'Copy code',
        'aria-label': 'Copy code',
        onClick: copy

      h('pre', null,

                  'aria-expanded': !collapsed,
                  onClick: () => this.setState(previous => ({
                    collapsed: {
                      ...previous.collapsed,
                      [category]: !previous.collapsed[category]
                    }
                  }))
                }, icon(collapsed ? 'chevronRight' : 'chevronDown', 15))
              ),
              !collapsed
                ? h('div', { className: 'group-items' },
                    ...docs.map(doc => h('button', {
                      type: 'button',
                      key: doc.id,
                      className: 'nav-entry' +
                        (this.state.selectedId === doc.id ? ' selected' : ''),
                      onClick: () => this.navigateTo(doc.id)
                    }, doc.title)),
                    query && docs.length === 0
                      ? h('div', { className: 'nav-empty' }, 'No matches')
                      : null
                  )
                : null
            );
          }),
          query && !this.state.docs.some(doc =>
            (doc.title + ' ' + doc.summary).toLowerCase().includes(query)
          ) ? h('div', { className: 'no-search' }, 'No documentation found') : null
        ),
        h('div', { className: 'sidebar-footer' },
          h('div', { className: 'side-footer-label' }, 'PROJECT OVERVIEW'),
          h('div', { className: 'side-stat' },
            icon('book', 17), h('span', null, this.state.docs.length + ' entries')),
          h('div', { className: 'side-stat' },
            icon('code', 17), h('span', null, this.state.statusGroups.length + ' status groups')),
          IS_DEV ? h('button', {
            type: 'button',
            className: 'sidebar-settings',
            onClick: () => this.setState({
              settingsOpen: true,
              settingsTab: 'stages',
              mobileNav: false
            })
          }, icon('settings', 16), ' Manage status groups') : null
        )
      );
    }
  };
})(window.Exdot);

  </script>
  <script>
/* Continuous scrolling articles with viewport-based lazy content mounting. */
(function (Exdot) {
  'use strict';

  const {
    h, icon, IS_DEV, STATUS_ORDER, CATEGORY_SINGULAR,
    ProgressSelect, CodeBlock, formatText
  } = Exdot;

  class LazyArticle extends React.Component {
    constructor(props) {
      super(props);
      this.state = { loaded: Boolean(props.force) };
      this.element = null;
      this.observer = null;
    }

    componentDidMount() {
      if (this.state.loaded) return;
      if (!('IntersectionObserver' in window)) {
        this.setState({ loaded: true });
        return;
      }

      this.observer = new IntersectionObserver(entries => {
        if (!entries.some(entry => entry.isIntersecting)) return;
        this.setState({ loaded: true });
        this.observer.disconnect();
      }, { root: this.props.scrollRoot, rootMargin: '700px 0px' });

      if (this.element) this.observer.observe(this.element);
    }

    componentDidUpdate(previousProps) {
      if (this.props.force && !this.state.loaded) {
        this.setState({ loaded: true });
        this.observer?.disconnect();
      }
    }

    componentWillUnmount() {
      this.observer?.disconnect();
    }

    render() {
      const doc = this.props.doc;
      const loaded = this.state.loaded || Boolean(this.props.force);
      return h('div', {
        ref: element => { this.element = element; },
        id: 'doc-' + doc.id,
        'data-doc-id': doc.id,
        className: 'lazy-document' + (loaded ? ' loaded' : '')
      }, loaded
        ? this.props.renderDoc(doc)
        : h('div', {
            className: 'lazy-placeholder',
            'aria-label': 'Documentation loads when nearby'
          }, h('span', null, doc.title))
      );
    }
  }

  Exdot.documentationViews = {
    renderStatusGroup(doc, group) {
      const stages = group.stages || [];
      const progress = doc.progress?.[group.id] || {};
      const finished = stages.filter(stage => progress[stage.id] === 'done').length;
      const total = stages.length;

      return h('section', { className: 'documentation-stage', key: group.id },
        h('div', { className: 'section-head' },
          h('div', null,
            h('h2', { className: 'stage-heading' }, group.title),
            group.description
              ? h('p', { className: 'stage-subtitle' }, group.description)
              : null
          ),
          h('span', { className: 'stage-completed' },
            finished + ' / ' + total + ' complete')
        ),
        h('div', {
          className: 'progress-bar',
          role: 'progressbar',
          'aria-valuenow': finished,
          'aria-valuemin': 0,
          'aria-valuemax': total
        }, h('div', { style: { width: (total ? 100 * finished / total : 0) + '%' } })),
        h('div', { className: 'stage-grid' },
          ...stages.map((stage, index) => {
            const status = STATUS_ORDER.includes(progress[stage.id])
              ? progress[stage.id]
              : 'planned';

            return h('div', {
              className: 'stage-card',
              key: stage.id,
              title: stage.description || stage.name
            },
              h('div', { className: 'stage-index' }, String(index + 1).padStart(2, '0')),
              h('div', { className: 'stage-name' }, stage.name),
              h(ProgressSelect, {
                value: status,
                stageName: stage.name,
                colors: this.currentColors(),
                onChange: value => this.updateDocStatus(doc.id, group.id, stage.id, value)
              })
            );
          })
        ),
        IS_DEV ? h('div', { className: 'stage-footnote' },
          icon('circleHelp', 14),
          ' Changes are saved directly to data/project.json.') : null
      );
    },

    renderSection(doc, section) {
      if (section.visible === false) return null;
      return h('section', {
        className: 'doc-section',
        key: section.id,
        id: 'section-' + doc.id + '-' + section.id
      },
        section.heading ? h('h2', null, section.heading) : null,
        section.kind === 'code'
          ? h(CodeBlock, {
              code: section.content,
              symbols: this.symbolTable(),
              onCopy: () => this.notify('Code copied')
            })
          : h('p', { className: 'doc-paragraph' },
              ...formatText(section.content, (id, anchor) => this.navigateTo(id, anchor)))
      );
    },

    renderArticle(doc) {
      const groups = this.state.statusGroups.filter(group =>
        (doc.statusGroupIds || []).includes(group.id)
      );

      return h('article', { className: 'doc-article' },
        h('div', { className: 'article-title-row' },
          h('div', { className: 'article-heading-wrap' },
            h('div', { className: 'eyebrow' },
              doc.category, ' / ', CATEGORY_SINGULAR[doc.category] || 'Element'),
            h('h1', null, doc.title)
          ),
          IS_DEV ? h('button', {
            className: 'button outline edit-button',
            onClick: () => this.openEditor(doc)
          }, icon('edit', 16), 'Edit') : null
        ),
        h('div', { className: 'title-rule' }),
        ...(doc.notices || []).map(notice => h('aside', {
          className: 'doc-notice notice-' + notice.kind,
          key: notice.id
        },
          h('strong', null, notice.title || notice.kind),
          notice.text ? h('span', null,
            ...formatText(notice.text, (id, anchor) => this.navigateTo(id, anchor))) : null
        )),
        doc.summary ? h('p', { className: 'doc-intro' },
          ...formatText(doc.summary, (id, anchor) => this.navigateTo(id, anchor))) : null,
        ...doc.sections.map(section => this.renderSection(doc, section)),
        ...groups.map(group => this.renderStatusGroup(doc, group)),
        h('div', { className: 'end-space' })
      );
    },

    renderContent() {
      const docs = this.state.docs.filter(doc => doc.category === this.state.activeCategory);
      if (!docs.length) {
        return h('main', { className: 'content', ref: element => { this.contentRef = element; } },
          h('div', { className: 'empty-document' },
            icon('book', 44),
            h('h1', null, 'No entries yet'),
            h('p', null, 'No documentation exists in this category yet.'),
            IS_DEV ? h('button', {
              className: 'button primary',
              onClick: () => this.openEditor(null)
            }, icon('plus'), 'Create an entry') : null
          )
        );
      }

      const loadThroughIndex = this.state.loadThroughId
        ? docs.findIndex(doc => doc.id === this.state.loadThroughId)
        : -1;

      return h('main', {
        className: 'content',
        ref: element => { this.contentRef = element; },
        onScroll: this.handleDocumentScroll
      }, ...docs.map(doc => h(LazyArticle, {
        key: doc.id,
        doc,
        force: this.state.selectedId === doc.id || (loadThroughIndex >= 0 && docs.indexOf(doc) <= loadThroughIndex),
        scrollRoot: this.contentRef,
        renderDoc: item => this.renderArticle(item)
      })));
    }
  };
})(window.Exdot);

  </script>
  <script>
/* Public documentation shell; editor modules are attached only in dev mode. */
(function (Exdot) {
  'use strict';

  const {
    h, initialState, DEFAULT_COLORS, LIGHT_COLORS,
    kebab, validHex, icon, IS_DEV, createSymbolTable
  } = Exdot;

  class App extends React.Component {
    constructor(props) {
      super(props);
      this.state = initialState();
      this.searchRef = null;
      this.contentRef = null;
      this.importRef = null;
      this.textareaRefs = {};
      this.saveTimer = null;
      this.saveInFlight = false;
      this.pendingPayload = null;
      this.scrollFrame = null;
      this.handleKeys = this.handleKeys.bind(this);
      this.handleDocumentScroll = this.handleDocumentScroll.bind(this);
      if (IS_DEV) this.flushOnPageHide = this.flushOnPageHide.bind(this);
    }

    componentDidMount() {
      document.addEventListener('keydown', this.handleKeys);
      if (IS_DEV) window.addEventListener('pagehide', this.flushOnPageHide);
    }

    componentWillUnmount() {
      document.removeEventListener('keydown', this.handleKeys);
      if (IS_DEV) window.removeEventListener('pagehide', this.flushOnPageHide);
      if (this.saveTimer) clearTimeout(this.saveTimer);
      if (this.scrollFrame) cancelAnimationFrame(this.scrollFrame);
    }

    componentDidUpdate(previousProps, previousState) {
      if (!IS_DEV) return;
      if (
        previousState.docs !== this.state.docs ||
        previousState.statusGroups !== this.state.statusGroups ||
        previousState.palettes !== this.state.palettes ||
        previousState.themeMode !== this.state.themeMode
      ) {
        this.queueSave();
      }
    }

    handleKeys(event) {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        this.searchRef?.focus();
      }

      if (event.key === 'Escape' && IS_DEV) {
        this.setState({ settingsOpen: false, editorOpen: false, mobileNav: false });
      }
    }

    symbolTable() {
      // Rebuild only when the article collection changes (e.g. save/import).
      if (this.symbolDocs !== this.state.docs) {
        this.symbolDocs = this.state.docs;
        this.cachedSymbols = createSymbolTable(this.state.docs);
      }
      return this.cachedSymbols;
    }

    currentColors() {
      return this.state.palettes[this.state.themeMode] || DEFAULT_COLORS;
    }

    themeVars() {
      const palette = this.currentColors();
      const fallback = this.state.themeMode === 'light' ? LIGHT_COLORS : DEFAULT_COLORS;
      const variables = {};

      Object.keys(DEFAULT_COLORS).forEach(key => {
        const value = validHex(palette[key]) ? palette[key] : fallback[key];
        variables['--color-' + kebab(key)] = value;
      });

      variables.colorScheme = this.state.themeMode;
      return variables;
    }

    selectedDoc() {
      return this.state.docs.find(doc => doc.id === this.state.selectedId) || null;
    }

    notify(message) {
      this.setState({ toast: message });
      if (this.toastTimer) clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => this.setState({ toast: '' }), 2600);
    }

    navigateTo(docId, sectionId) {
      const doc = this.state.docs.find(item => item.id === docId);
      if (!doc) return;

      this.setState({
        activeCategory: doc.category,
        selectedId: doc.id,
        mobileNav: false,
        query: '',
        loadThroughId: doc.id
      }, () => {
        requestAnimationFrame(() => {
          const target = document.getElementById(
            sectionId ? 'section-' + doc.id + '-' + sectionId : 'doc-' + doc.id
          ) || document.getElementById('doc-' + doc.id);
          target?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    }

    chooseCategory(category) {
      const first = this.state.docs.find(doc => doc.category === category);
      this.setState({
        activeCategory: category,
        selectedId: first?.id || null,
        mobileNav: false,
        query: '',
        loadThroughId: first?.id || null
      }, () => {
        if (this.contentRef) this.contentRef.scrollTop = 0;
      });
    }

    handleDocumentScroll() {
      if (this.scrollFrame) return;
      this.scrollFrame = requestAnimationFrame(() => {
        this.scrollFrame = null;
        if (!this.contentRef) return;
        const top = this.contentRef.getBoundingClientRect().top + 120;
        const elements = this.contentRef.querySelectorAll('[data-doc-id]');
        let current = null;
        for (const element of elements) {
          if (element.getBoundingClientRect().top <= top) current = element.dataset.docId;
          else if (!current) { current = element.dataset.docId; break; }
          else break;
        }
        if (current && current !== this.state.selectedId) {
          this.setState({ selectedId: current });
        }
      });
    }

    render() {
      return h('div', { className: 'app-shell', style: this.themeVars() },
        h('header', { className: 'topbar' },
          h('div', { className: 'brand' },
            h('button', {
              className: 'mobile-menu',
              'aria-label': 'Open navigation',
              onClick: () => this.setState({ mobileNav: !this.state.mobileNav })
            }, icon('folder', 20)),
            h('span', null, 'Exdot ', h('span', { className: 'brand-second' }, 'documentation'))
          ),
          h('div', { className: 'search-wrapper' },
            icon('search', 17),
            h('input', {
              ref: element => { this.searchRef = element; },
              value: this.state.query,
              type: 'search',
              placeholder: 'Search',
              onChange: event => this.setState({ query: event.target.value }),
              'aria-label': 'Search documentation'
            }),
            h('kbd', null, 'Ctrl K'),
            this.renderSearchResults()
          ),
          IS_DEV
            ? this.renderDeveloperToolbar()
            : h('button', {
                className: 'reader-theme-switch',
                type: 'button',
                title: 'Toggle between dark and light modes',
                onClick: () => this.setState(previous => ({
                  themeMode: previous.themeMode === 'dark' ? 'light' : 'dark'
                }))
              },
                icon(this.state.themeMode === 'dark' ? 'sun' : 'moon', 16),
                h('span', null, this.state.themeMode === 'dark' ? 'Light' : 'Dark')
              )
        ),
        h('div', { className: 'app-main' },
          this.renderSidebar(),
          this.renderContent()
        ),
        this.state.mobileNav
          ? h('div', {
              className: 'mobile-shade',
              onClick: () => this.setState({ mobileNav: false })
            })
          : null,
        IS_DEV ? this.renderSettings() : null,
        IS_DEV ? this.renderEditor() : null,
        this.state.toast
          ? h('div', { className: 'toast', role: 'status' }, icon('check', 15), this.state.toast)
          : null
      );
    }
  }

  Object.assign(App.prototype, Exdot.searchViews, Exdot.sidebarViews, Exdot.documentationViews);
  if (IS_DEV) {
    Object.assign(
      App.prototype,
      Exdot.devPersistence,
      Exdot.documentActions,
      Exdot.stageActions,
      Exdot.appearanceActions,
      Exdot.dataActions,
      Exdot.colorViews,
      Exdot.settingsViews,
      Exdot.editorViews,
      Exdot.devToolbarViews
    );
  }

  Exdot.App = App;
})(window.Exdot);

  </script>
  <script>
/* Start the offline React app once every feature is loaded. */
(function (Exdot) {

  'use strict';

  ReactDOM.render(
    Exdot.h(Exdot.App),
    document.getElementById('root')
  );
})(window.Exdot);

  </script>
